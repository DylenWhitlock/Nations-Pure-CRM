<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Your Quote · Nation's Pure</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
:root{--ink:#14222B; --muted:#5D6B74; --line:#E3E8EB; --bg:#F5F8F9; --card:#fff; --navy:#1F3A5F; --good:#2E8B57; --good-s:#E9F7EF;}
*{box-sizing:border-box; margin:0; padding:0;}
body{font-family:Inter,-apple-system,'Segoe UI',sans-serif; background:var(--bg); color:var(--ink); line-height:1.45; -webkit-font-smoothing:antialiased;}
.wrap{max-width:640px; margin:0 auto; padding:20px 16px 48px;}
header{display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:22px;}
header img{height:52px;}
header .co{text-align:right; font-size:12.5px; color:var(--muted);}
header .co b{display:block; color:var(--ink); font-size:13.5px;}
h1{font-size:28px; font-weight:800; letter-spacing:-.02em;}
.sub{color:var(--muted); font-size:14px; margin-top:4px;}
.card{background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px; margin-top:16px;}
h2{font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.06em; color:var(--muted); margin-bottom:8px;}
.two{display:grid; grid-template-columns:1fr 1fr; gap:16px;}
.two div{font-size:14.5px;} .two b{display:block;}
.item{display:flex; justify-content:space-between; gap:16px; padding:12px 0; border-top:1px solid var(--line); font-size:15px;}
.item:first-of-type{border-top:none; padding-top:0;}
.item .d{white-space:pre-wrap;} .item .p{font-weight:700; flex:none;}
.total{display:flex; justify-content:space-between; align-items:center; margin-top:6px; padding-top:14px; border-top:2px solid var(--ink); font-size:20px; font-weight:800;}
.note{font-size:14.5px; white-space:pre-wrap;}
.approve{display:block; width:100%; margin-top:20px; padding:16px; border:none; border-radius:12px; background:var(--good); color:#fff; font:inherit; font-size:17px; font-weight:800; cursor:pointer;}
.approve:disabled{opacity:.6; cursor:default;}
.confirm{margin-top:20px; background:var(--card); border:2px solid var(--good); border-radius:14px; padding:16px;}
.confirm p{font-size:15px; margin-bottom:12px;}
.row{display:flex; gap:10px;}
.row button{flex:1; padding:13px; border-radius:10px; font:inherit; font-weight:800; font-size:15px; cursor:pointer; border:1px solid var(--line); background:#fff; color:var(--ink);}
.row .yes{background:var(--good); border-color:var(--good); color:#fff;}
.done{margin-top:20px; background:var(--good-s); color:var(--good); border-radius:14px; padding:18px; text-align:center; font-weight:700; font-size:15.5px;}
.done b{display:block; font-size:19px; margin-bottom:4px;}
.links{display:flex; gap:16px; justify-content:center; margin-top:16px; font-size:14px;}
.links a{color:var(--navy); font-weight:700;}
footer{margin-top:26px; text-align:center; font-size:12.5px; color:var(--muted);}
.msg{text-align:center; padding:80px 16px; color:var(--muted);}
@media (max-width:480px){ .two{grid-template-columns:1fr;} }
@media print{ body{background:#fff;} .approve,.confirm,.links{display:none;} .card{border-color:#ccc;} }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="msg">Loading your quote…</div></div>
<script src="config.js"></script>
<script>
(function(){
  const $app = document.getElementById('app');
  const esc = s=>String(s==null?'':s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
  const money = n=>'$'+(Number(n)||0).toLocaleString('en-US',{minimumFractionDigits:2, maximumFractionDigits:2});
  const phone = p=>{ const d = String(p||'').replace(/\D/g,'').replace(/^1(?=\d{10}$)/,''); return d.length===10 ? '('+d.slice(0,3)+') '+d.slice(3,6)+'-'+d.slice(6) : (p||''); };
  const token = new URLSearchParams(location.search).get('q') || '';
  const fail = t=>{ $app.innerHTML = '<div class="msg">'+esc(t)+'</div>'; };
  if(token.length < 24) return fail("This quote link isn't valid. Please ask your water specialist to resend it.");
  const rpc = (fn, body)=>fetch(window.SUPABASE_URL.replace(/\/$/,'')+'/rest/v1/rpc/'+fn, {
    method:'POST', headers:{ apikey:window.SUPABASE_ANON_KEY, Authorization:'Bearer '+window.SUPABASE_ANON_KEY, 'Content-Type':'application/json' },
    body: JSON.stringify(body) }).then(r=>r.ok ? r.json() : null);

  let q = null, asking = false, busy = false;
  function paint(){
    const c = q.cust||{};
    const when = new Date(Number(q.at)||Date.now()).toLocaleDateString('en-US',{month:'long', day:'numeric', year:'numeric'});
    let h = '<header><img src="assets/nations-pure-logo.png" alt="Nation\'s Pure Water Systems"><div class="co"><b>Nation\'s Pure Water Systems</b>888-763-0050<br>nationspure.com</div></header>';
    h += '<h1>Your quote</h1><div class="sub">Quote #'+esc(q.number)+' · '+esc(when)+'</div>';
    h += '<div class="card two"><div><h2>Prepared for</h2><b>'+esc(c.name)+'</b>'+[c.address, phone(c.phone), c.email].filter(Boolean).map(esc).join('<br>')+'</div>';
    h += '<div><h2>Your specialist</h2><b>'+esc(q.rep||"Nation's Pure")+'</b>'+[phone(q.repPhone), q.repEmail].filter(Boolean).map(esc).join('<br>')+'</div></div>';
    h += '<div class="card"><h2>System offering</h2>';
    (q.items||[]).forEach(i=>{ h += '<div class="item"><div class="d">'+esc(i.desc)+'</div><div class="p">'+money(i.price)+'</div></div>'; });
    h += '<div class="total"><span>Total</span><span>'+money(q.total)+'</span></div></div>';
    if(q.note) h += '<div class="card"><h2>Notes</h2><div class="note">'+esc(q.note)+'</div></div>';
    if(q.approvedAt){
      h += '<div class="done"><b>Quote approved</b>Thank you! '+esc((q.rep||'Your specialist').split(' ')[0])+' will reach out to schedule your installation.</div>';
    } else if(asking){
      h += '<div class="confirm"><p>Approve this quote for <b>'+money(q.total)+'</b>?</p><div class="row"><button id="no">Not yet</button><button class="yes" id="yes"'+(busy?' disabled':'')+'>'+(busy?'Approving…':'Yes, approve')+'</button></div></div>';
    } else {
      h += '<button class="approve" id="approve">Approve quote</button>';
    }
    h += '<div class="links"><a href="#" id="print">Print</a>'+(q.pdfUrl ? '<a href="'+esc(q.pdfUrl)+'" target="_blank" rel="noopener">Download PDF</a>' : '')+'</div>';
    h += '<footer>Nation\'s Pure Water Systems · 108 Nu Energy Dr, Suite 2, Aledo, TX 76008</footer>';
    $app.innerHTML = h;
    const on = (id, fn)=>{ const b = document.getElementById(id); if(b) b.addEventListener('click', fn); };
    on('approve', ()=>{ asking = true; paint(); });
    on('no', ()=>{ asking = false; paint(); });
    on('print', e=>{ e.preventDefault(); window.print(); });
    on('yes', ()=>{
      if(busy) return; busy = true; paint();
      rpc('quote_approve', { p_token: token }).then(r=>{
        busy = false;
        if(r && r.ok){ q.approvedAt = Date.now(); asking = false; paint(); }
        else { asking = false; paint(); alertBox("We couldn't approve this quote online. Please call 888-763-0050 and we'll take care of it."); }
      }).catch(()=>{ busy = false; asking = false; paint(); alertBox("We couldn't reach our system. Please check your connection and try again."); });
    });
  }
  function alertBox(t){ const d = document.createElement('div'); d.className = 'confirm'; d.innerHTML = '<p>'+esc(t)+'</p>'; $app.insertBefore(d, $app.querySelector('.links')); }

  rpc('quote_view', { p_token: token }).then(d=>{
    if(!d || !d.items) return fail("We couldn't find this quote. Please ask your water specialist to resend it.");
    q = d; paint();
  }).catch(()=>fail("We couldn't load this quote. Please check your connection and try again."));
})();
</script>
</body>
</html>
